<!DOCTYPE html>
<html>
<head>
    <title>Изборни резултати по секции, София</title>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <link rel="stylesheet" href="../css/maps_shared.css">
    <link rel="stylesheet" href="../css/sofia.css">
</head>

<body>
<div class="map-container">
    <div id="map"></div>
    <div class="dropdown-container">
        <button id="menuToggle" class="menu-toggle">
            <span class="menu-icon">☰</span>
            <span class="menu-text">Меню</span>
        </button>
        <div class="menu-content">
            <select id="csvDropdown"></select>
            <br>
            <select id="rayonDropdown" hidden></select>
            <br>
            <div id='partySelection' class="combobox-wrapper">
                <div>
                    <input type="text" id="partyCombobox" class="combobox-input" placeholder="избери партии">
                    <div class="multi-select-tags" id="partySelectedTags"></div>
                </div>
                <div id="partyOptionsList" class="options-list"></div>
                <input type="hidden" id="partySelectedValue">
            </div>
            <div id="layerInfo" class="layer-info"></div>
        </div>
    </div>

    <button id="showInfo" class="show-info-button">i</button>
    <div id="infoBox" class="info-box" style="display:none;">
        Изборните данни са от <a href=https://results.cik.bg>ЦИК</a>.<br>
        Инструменти за анализ:<a href=https://bg-izbori.herokuapp.com/>bg-izbori.herokuapp.com</a>.<br>
        Границите на секциите са предоставени от <a href=https://data-for-good.bg/>"Данни за добро"</a>.<br>
        За коментари и намерени грешки: <a href=https://twitter.com/petar_baka>@petar_baka</a>.<br>
        <button id="hideInfo">Затвори</button>
    </div>
</div>
<script type='module' src="../js/sofia.js"></script>
</body>
</html>
